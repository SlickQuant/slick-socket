name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive_ext: tar.gz
            configs: Release
          - os: windows-latest
            archive_ext: zip
            # wepoll is a compiled library on Windows; ship both builds so Debug consumers get a matching C runtime
            configs: Debug Release
          - os: macos-latest
            archive_ext: tar.gz
            configs: Release

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@v3.29.0
        with:
          cmake-version: '3.25.x'

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SLICK_SOCKET_TESTING=OFF -DBUILD_SLICK_SOCKET_EXAMPLES=OFF

      # The archive is exactly the install tree: headers, the CMake package for find_package(slick-socket)
      # and, on Windows, the wepoll header and libraries
      - name: Build and Install
        run: |
          for config in ${{ matrix.configs }}; do
            cmake --build build --config "$config"
            cmake --install build --config "$config" --prefix dist
          done

      # Builds a consumer that is given nothing but the package location, as a release user would
      - name: Verify Package
        run: |
          prefix="$PWD/dist"
          if command -v cygpath > /dev/null; then prefix=$(cygpath -m "$prefix"); fi
          cmake -S tests/install_consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          for config in ${{ matrix.configs }}; do
            cmake --build build-consumer --config "$config"
          done

      - name: Create Archive
        run: |
          archive="$PWD/slick-socket-${{ runner.os }}-${{ github.ref_name }}.${{ matrix.archive_ext }}"
          cd dist
          if [ "${{ matrix.archive_ext }}" = zip ]; then
            cmake -E tar cfv "$archive" --format=zip .
          else
            cmake -E tar cfzv "$archive" .
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slick-socket-${{ runner.os }}-${{ github.ref_name }}
          path: slick-socket-*
          retention-days: 30

  extract-changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      changelog: ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          if [ -f CHANGELOG ]; then
            # Extract the section for this version from CHANGELOG
            VERSION="${{ github.ref_name }}"
            # Remove any suffix after the version (e.g., -test, -rc1)
            VERSION_CLEAN=$(echo "$VERSION" | sed 's/-.*$//')
            # Escape dots in version for regex
            VERSION_ESCAPED=$(echo "$VERSION_CLEAN" | sed 's/\./\\./g')
            # Use awk to extract content: start at version header (format: v1.5.2 - [date]), stop at next version header
            CHANGES=$(awk "BEGIN{p=0} /^#$VERSION_ESCAPED/{p=1;next} /^#/{p=0} p" CHANGELOG | sed '/^$/d')

            if [ -z "$CHANGES" ]; then
              echo "CHANGELOG_CONTENT=No changelog entry found for this version." >> $GITHUB_OUTPUT
            else
              # Escape newlines for GitHub output
              echo "CHANGELOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
              echo "$CHANGES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          else
            echo "CHANGELOG_CONTENT=CHANGELOG not found." >> $GITHUB_OUTPUT
          fi

  create-release:
    runs-on: ubuntu-latest
    needs: [extract-changelog, build-and-package]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes

            ${{ needs.extract-changelog.outputs.changelog }}
          
          draft: true
          prerelease: false
          generate_release_notes: false
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
