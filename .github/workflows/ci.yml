name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run Tests
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

    # --output-on-failure shows only failed tests' output; a skipped test's reason is left in the log
    - name: Show Skipped Test Reasons
      if: always()
      shell: bash
      run: |
        log=build/Testing/Temporary/LastTest.log
        [ -f "$log" ] || exit 0  # the tests never ran
        awk '{ sub(/\r$/, "") }
             /^\[ RUN      \]/ { test = $4 }
             /: Skipped$/ { getline reason; sub(/\r$/, "", reason); print test ": " reason; skipped++ }
             END { if (!skipped) print "No tests were skipped" }' "$log"
